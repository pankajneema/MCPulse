[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpulse"
version = "0.3.0a1"
description = "Local-first Claude Code permission relay"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
slack = ["slack-sdk==3.45.0"]

[project.scripts]
mcpulse = "mcpulse.cli:main"

[tool.setuptools]
py-modules = ["run_mcpulse"]

[tool.setuptools.packages.find]
include = ["mcpulse*"]
